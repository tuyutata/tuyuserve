# TuyuServe 是独立 Worker，不复用 CitizenServe 的物理资源、路由或凭据。
name = "tuyuserve"
main = "src/index.ts"
compatibility_date = "2026-08-24"
workers_dev = false
preview_urls = false
routes = [{ pattern = "download.tuyulove.com", custom_domain = true }]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "tuyuserve"
database_id = "00000000-0000-0000-0000-000000000000"

# Session 明文只返回客户端，KV 键和 D1 索引只使用 Token 的 SHA-256。
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "tuyubooking"

[vars]
CHALLENGE_TTL_SECONDS = "300"
SESSION_TTL_SECONDS = "28800"
