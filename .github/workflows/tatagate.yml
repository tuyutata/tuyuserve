name: tatagate

# 中文说明：main代码推送独立触发本仓塔塔门禁；CI和Release仍保持自己的手动流程。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tatagate-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出准确推送提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 登记Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 本仓资源验真与完整塔塔门禁
        shell: bash
        run: |
          set -euo pipefail
          node .github/tatagate/index.mjs remote
