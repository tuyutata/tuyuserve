[package]
name = "tuyu-account"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blake2 = "=0.10.6"
getrandom = "=0.3.4"
schnorrkel = { version = "=0.11.5", default-features = false, features = ["alloc", "getrandom", "preaudit_deprecated"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
time = { version = "0.3", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
